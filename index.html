    <style>
      html {
        font-family: "Roboto", sans-serif;
      }

      body {
        font-size: 18px;
        padding: 1.5em;
        line-height: 1.25em;
        color: #111;
        background-color: white;
      }

      h1 {
        font-family: "Fira Sans", sans-serif;
        font-weight: 600;
        color: rgb(34, 150, 150)
      }
      
      h2, h3, h4, h5, h6 {
        font-family: "Fira Sans", sans-serif;
        font-weight: 600;
      }

      code, pre, kbd, samp {
        font-family: "Inconsolata", monospace;
        font-size: 0.95em;
      }

      a {
        color: #0066dd;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .container {
        max-width: 640px;
        margin: 0 auto;

        display: flex;
        flex-flow: column wrap;
        justify-content: space-evenly;
        align-items: flex-start;

      header {
        margin: 0.5em auto;
        text-align: center;
      }

      }

      }

      header a, .icons a {

      }

      header a:hover {
        text-decoration: none;
      }

      .front-page {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
      }

      @media (min-width: 500px) {
        .front-page {
          flex-direction: column-reverse;
          column-gap: 1rem;
        }

        .bio-photo {
          order: 1;
        }
