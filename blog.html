<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Umair Mazhar Blog</title>
    <link rel="icon" type="image/x-icon" href="/assets/black.jpeg" />
    <link rel="stylesheet" href="styles.css" />

    <!-- Dark Mode Toggle Script -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const toggle = document.querySelector("#dark-mode-toggle");

        // Set default mode to dark if not already set
        if (!localStorage.getItem("darkMode")) {
          localStorage.setItem("darkMode", "dark");
        }

        const currentMode = localStorage.getItem("darkMode");
        document.body.classList.toggle("dark", currentMode === "dark");
        toggle.innerHTML = currentMode === "dark" ? "🌞" : "🌜";

        toggle.addEventListener("click", () => {
          document.body.classList.toggle("dark");
          const isDark = document.body.classList.contains("dark");
          localStorage.setItem("darkMode", isDark ? "dark" : "light");
          toggle.innerHTML = isDark ? "🌞" : "🌜";
        });
      });
    </script>
  </head>

  <!-- Body defaults to dark mode as per your existing code -->
  <body class="dark">
    <div class="container">
      <header>
        <br /><br />
        <h1>Umair Mazhar</h1>
        <h2>Vancouver, BC</h2>
        <br />
        <nav>
          <div class="nav-links">
            <a class="menulink" href="/">Home</a> | 
            <a class="menulink" href="./resume">Resume</a> |
            <a class="menulink" href="./blog">Blog</a>
          </div>
          <button id="dark-mode-toggle" class="dark-mode-button">🔦</button>
        </nav>
        <hr />
      </header>
      <main>
        <!-- Blog Entries Section -->
        <section class="blog-entries">
          <article class="blog-entry">
            <h3><a href="/blog/2024/08/california-roadtrip/">California Roadtrip</a></h3>
            <p>
              Two week long roadtrip to California from Vancouver
            </p>
            <span class="date">Published on: August 21, 2024</span>
          </article>
          <hr />
        </section>
      </main>
    </div>
    <footer>
      <p>&copy; 2024 Umair Mazhar</p>
    </footer>
  </body>
</html>
